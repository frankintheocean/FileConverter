[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fileconverter"
version = "1.0.1"
description = "Local desktop media and document converter"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["PySide6==6.10.2", "Pillow==12.1.0", "PyMuPDF==1.26.7", "watchdog==6.0.0", "Send2Trash==2.1.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.0", "pyinstaller==6.18.0", "mypy==2.4.0"]

[project.gui-scripts]
fileconverter = "fileconverter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
platform = "win32"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.isort]
known-first-party = ["fileconverter", "build"]
